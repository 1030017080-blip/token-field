name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml', 'scripts/check-static.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check local HTML assets
        run: python3 scripts/check-static.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v4
